[project]
name = "protoforge-api"
version = "0.1.0"
description = "ProtoForge Python sidecar - FastAPI server wrapping proto-language"
requires-python = ">=3.10,<3.13"
# Phase 1 起步只装 web 栈。torch/spliceai/biopython 等在 Task 3 接 proto-language 时再补。
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "numpy>=1.26",  # 简化版 SpliceTransformer(PWM)评分需要
    "cryptography>=49.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

# Phase 3 Task 1.2: ML 模型加载器(接口稳定,不强制装 ML 框架)
[tool.uv.dependency-groups]
# Phase 1.5/2 接 torch / transformers / biotite 时取消注释
# models = [
#     "torch>=2.0.0",
#     "transformers>=4.40.0",
#     "safetensors>=0.4.0",
# ]

# Phase 3 Task 1.3: 本地 LLM 加载器(Qwen2.5-7B GGUF,接口稳定,不强制装 llama-cpp)
# Phase 1.5/2 接通 llama-cpp-python 真实推理时取消注释(注意:Windows 上
# pip install llama-cpp-python 需要先装 Visual Studio Build Tools,会编译 10+ 分钟)
# llm = [
#     "llama-cpp-python>=0.2.0",
# ]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
